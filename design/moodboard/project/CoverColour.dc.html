<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cover colour</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;family=Schibsted+Grotesk:wght@400;500;600&amp;family=Martian+Mono:wght@400;500&amp;display=swap">
<style>
html,body{margin:0;overflow:hidden}
a{color:#1C1D1A}a:hover{color:#B8430F}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: clip; background: #8C8D88; color: #1C1D1A; font-family: 'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif">

  <div role="dialog" aria-label="Custom colour" style="position: absolute; left: 16px; right: 16px; top: 150px; box-sizing: border-box; padding: 24px; border-radius: 24px; background: #F7F7F4; display: flex; flex-direction: column; gap: 16px">
    <h2 style="margin: 0; font-size: 22px; font-weight: 500">Custom colour</h2>
    <div style="display: flex; align-items: center; justify-content: center; gap: 16px">
      <div aria-label="Colour wheel" role="img" style="position: relative; width: 184px; height: 184px; border-radius: 50%; background: radial-gradient(circle, #FFFFFF 0%, rgba(255,255,255,0) 70%), conic-gradient(from 90deg, #FF0000, #FFFF00, #00FF00, #00FFFF, #0000FF, #FF00FF, #FF0000)">
        <div style="position: absolute; inset: 0; border-radius: 50%; background: rgba(0,0,0,0.46)"></div>
        <div aria-hidden="true" style="position: absolute; left: 58px; top: 140px; width: 20px; height: 20px; box-sizing: border-box; border-radius: 50%; border: 3px solid #FFFFFF; box-shadow: 0 0 0 1px rgba(0,0,0,0.4); background: #8A3B6F"></div>
      </div>
      <div aria-hidden="true" style="width: 40px; height: 54px; border-radius: 2px 4px 4px 2px; background: #8A3B6F"></div>
    </div>
    <div aria-label="Brightness" role="img" style="position: relative; height: 16px; border-radius: 8px; background: linear-gradient(90deg, #000000, #FF6ACF)">
      <div aria-hidden="true" style="position: absolute; left: 118px; top: -2px; width: 20px; height: 20px; box-sizing: border-box; border-radius: 50%; border: 3px solid #FFFFFF; box-shadow: 0 0 0 1px rgba(0,0,0,0.4); background: #8A3B6F"></div>
    </div>
    <label style="display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: #5E615A">Hex
      <input type="text" value="#8A3B6F" aria-label="Hex" style="border: none; border-bottom: 1px solid #C9CBC3; padding: 6px 0; background: none; font-family: 'Martian Mono', monospace; font-size: 17px; color: #1C1D1A">
    </label>
    <div style="display: flex; justify-content: flex-end; gap: 8px">
      <button type="button" style="min-height: 44px; padding: 0 12px; border: none; background: none; font-family: inherit; font-size: 14px; font-weight: 500; color: #1C1D1A; cursor: pointer">Cancel</button>
      <button type="button" style="min-height: 44px; padding: 0 12px; border: none; background: none; font-family: inherit; font-size: 14px; font-weight: 500; color: #1C1D1A; cursor: pointer">Use colour</button>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 14px 24px 34px; border-radius: 28px 28px 0 0; background: #EDEDE9; display: flex; flex-direction: column; gap: 16px">
    <div aria-hidden="true" style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: #8C8F87"></div>
    <h2 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 22px; font-weight: 500">Change cover</h2>
    <div style="display: flex; gap: 12px">
      <sc-for list="{{cloths}}" as="item" hint-placeholder-count="6">
        <button type="button" aria-label="{{item.name}}" style="width: 40px; height: 40px; padding: 0; border: none; border-radius: 50%; background: {{item.color}}; cursor: pointer"></button>
      </sc-for>
      <button type="button" aria-label="Custom colour #8A3B6F" aria-pressed="true" style="width: 40px; height: 40px; box-sizing: border-box; padding: 0; border: 2px solid #1C1D1A; border-radius: 50%; background: #8A3B6F; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px; fill: none; stroke: #F7F7F4; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M14 7L17 10M4 20L7 19L18 8A2.1 2.1 0 0 0 15 5L5 16Z"></path></svg></button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      cloths: [
        { name: 'Waxed canvas', color: '#B59A6E' },
        { name: 'Forest', color: '#2F4A3A' },
        { name: 'Rust', color: '#A2492B' },
        { name: 'Slate', color: '#46525C' },
        { name: 'Ochre', color: '#C49A2C' },
        { name: 'Lake', color: '#2E5A73' }
      ]
    };
  }
}
</script>
</body>
</html>
