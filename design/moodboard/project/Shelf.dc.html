<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shelf</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;family=Schibsted+Grotesk:wght@400;500;600&amp;family=Martian+Mono:wght@400;500&amp;display=swap">
<style>
html,body{margin:0;overflow:hidden}
a{color:#1C1D1A}a:hover{color:#B8430F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: clip; background: #F7F7F4; color: #1C1D1A; font-family: 'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column">

  <div style="height: 58px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 16px 0 20px">
    <div style="display: flex; align-items: center; gap: 8px">
      <div style="width: 28px; height: 28px; flex: none; border-radius: 7px; overflow: hidden; background: #1C1D1A">
        <svg viewBox="0 0 100 100" aria-hidden="true" style="display: block; width: 100%; height: 100%"><path d="M0 100V76L28 56L40 64L58 42L74 58L100 47V100Z" style="fill: #3A464F"></path><path d="M0 76L28 56L40 64L58 42L74 58L100 47" style="fill: none; stroke: #F7F7F4; stroke-width: 4.5; stroke-linejoin: round; stroke-linecap: round"></path><rect x="48" y="35" width="20" height="6" rx="3" style="fill: #F7F7F4"></rect><rect x="51" y="27" width="14" height="6" rx="3" style="fill: #F7F7F4"></rect><rect x="54" y="19" width="8" height="6" rx="3" style="fill: #E2531B"></rect><rect x="0" y="0" width="11" height="100" style="fill: rgba(0,0,0,0.38)"></rect><path d="M79.5 0H86.5V20L83 17L79.5 20Z" style="fill: #E2531B"></path></svg>
      </div>
    </div>
    <button type="button" aria-label="New notebook" style="min-height: 44px; min-width: 44px; display: flex; align-items: center; justify-content: center; gap: 5px; padding: 0 8px; border: none; background: none; font-family: 'Schibsted Grotesk', sans-serif; font-size: 13px; font-weight: 600; color: #1C1D1A; cursor: pointer"><svg viewBox="0 0 24 24" aria-hidden="true" style="width: 15px; height: 15px; fill: none; stroke: #1C1D1A; stroke-width: 2; stroke-linecap: round"><path d="M12 5V19M5 12H19"></path></svg>New</button>
  </div>

  <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; padding: 18px 24px 0">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <h1 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 32px; font-weight: 500">Shelf</h1>
      <span style="font-family: 'Martian Mono', monospace; font-size: 10px; color: #5E615A">7 NOTEBOOKS</span>
    </div>

    <div style="display: flex; align-items: center; gap: 8px; font-size: 10px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8A6A45">On the trail<span style="flex: 1; height: 1px; background: #D9DAD3"></span></div>

    <a href="DayPage.dc.html" aria-label="Open PCT 2026 to today's page" style="align-self: center; position: relative; display: block; width: 186px; height: 252px; margin-bottom: 18px; text-decoration: none">
      <div style="position: absolute; inset: 0; overflow: hidden; border-radius: 3px 8px 8px 3px; background: #2F4A3A; box-shadow: 0 2px 4px rgba(28,29,26,0.2), 0 14px 26px rgba(28,29,26,0.14)">
        <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 12px; background: #263D30"></div>
        <div style="position: absolute; top: 0; bottom: 0; right: 24px; width: 8px; background: #1A2921"></div>
        <div style="position: absolute; left: 28px; top: 28px; right: 44px; display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 9px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #C9D3CB">Pacific Crest Trail</span>
          <span style="font-family: 'Newsreader', Georgia, serif; font-size: 32px; font-weight: 500; line-height: 1.05; color: #F1F3EE">PCT 2026</span>
          <span style="font-family: 'Newsreader', Georgia, serif; font-style: italic; font-size: 17px; color: #DDE4DC">“Switchback”</span>
        </div>
        <svg viewBox="0 0 100 100" aria-hidden="true" style="position: absolute; left: 24px; bottom: 46px; width: 52px; height: 52px; fill: none; stroke: #4D6A58; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round"><path d="M4 76L28 56L40 64L58 42L74 58L96 47"></path><rect x="48" y="35" width="20" height="6" rx="3"></rect><rect x="51" y="27" width="14" height="6" rx="3"></rect><rect x="54" y="19" width="8" height="6" rx="3"></rect></svg>
        <span style="position: absolute; left: 28px; bottom: 24px; font-family: 'Martian Mono', monospace; font-size: 9px; color: #C9D3CB">DAY 47 · MI 919.2</span>
      </div>
      <div aria-hidden="true" style="position: absolute; right: 48px; bottom: -22px; width: 12px; height: 34px; background: #E2531B; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 80%, 0 100%)"></div>
    </a>

    <div style="display: flex; align-items: center; gap: 8px; font-size: 10px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8A6A45">On the shelf<span style="flex: 1; height: 1px; background: #D9DAD3"></span></div>

    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 10px">
      <sc-for list="{{books}}" as="item" hint-placeholder-count="6">
        <button type="button" aria-label="Open {{item.name}} {{item.year}}" style="display: flex; flex-direction: column; align-items: flex-start; gap: 5px; padding: 0; border: none; background: none; text-align: left; font-family: inherit; color: #1C1D1A; cursor: pointer">
          <span style="position: relative; display: block; width: 72px; height: 97px; overflow: hidden; border-radius: 2px 5px 5px 2px; background: {{item.color}}; box-shadow: inset 5px 0 0 rgba(0,0,0,0.18), 0 2px 5px rgba(28,29,26,0.16)">
            <span style="position: absolute; top: 0; bottom: 0; right: 9px; width: 3px; background: rgba(0,0,0,0.32)"></span>
            <svg viewBox="0 0 100 100" aria-hidden="true" style="position: absolute; left: 11px; top: 29px; width: 43px; height: 43px; fill: none; stroke: rgba(0,0,0,0.32); stroke-width: 3.4; stroke-linejoin: round; stroke-linecap: round"><path d="M4 76L28 56L40 64L58 42L74 58L96 47"></path><rect x="48" y="35" width="20" height="6" rx="3"></rect><rect x="51" y="27" width="14" height="6" rx="3"></rect><rect x="54" y="19" width="8" height="6" rx="3"></rect></svg>
          </span>
          <span style="font-size: 11px; font-weight: 600; line-height: 1.25">{{item.name}}</span>
          <span style="font-family: 'Martian Mono', monospace; font-size: 8.5px; color: #5E615A">{{item.year}}</span>
        </button>
      </sc-for>
    </div>

    <div style="display: flex; align-items: center; gap: 8px; padding-top: 2px; font-family: 'Martian Mono', monospace; font-size: 9.5px; color: #5E615A">
      <span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 50%; background: #4F6B4A"></span>
      SAFE AS OF MAMMOTH LAKES · 2 DAYS AGO
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      books: [
        { name: 'John Muir Trail', year: '2025', color: '#46525C' },
        { name: 'Day hikes', year: '2025', color: '#B59A6E' },
        { name: 'Wonderland Trail', year: '2024', color: '#A2492B' },
        { name: 'Day hikes', year: '2024', color: '#C49A2C' },
        { name: 'Lost Coast', year: '2023', color: '#3F5A47' },
        { name: 'Day hikes', year: '2023', color: '#5D6770' }
      ]
    };
  }
}
</script>
</body>
</html>
