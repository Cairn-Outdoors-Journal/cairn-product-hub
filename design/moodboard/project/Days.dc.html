<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Days tab</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;family=Schibsted+Grotesk:wght@400;500;600&amp;family=Martian+Mono:wght@400;500&amp;display=swap">
<style>
html,body{margin:0;overflow:hidden}
a{color:#1C1D1A}a:hover{color:#B8430F}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: clip; background: #F7F7F4; color: #1C1D1A; font-family: 'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif">

  <div style="height: 54px; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid #D9DAD3">
    <span style="width: 96px; font-size: 14px; font-weight: 500">← Shelf</span>
    <span style="flex: 1; text-align: center; font-size: 11px; font-weight: 600; letter-spacing: 0.14em">PCT 2026</span>
    <span style="width: 96px"></span>
  </div>

  <div aria-hidden="true" style="position: absolute; left: 20px; right: 46px; top: 68px; font-family: 'Martian Mono', monospace">
    <div style="border-top: 2px solid #1C1D1A; border-bottom: 1px solid #1C1D1A; padding: 6px 0; display: flex; align-items: baseline; justify-content: space-between">
      <span style="font-size: 20px; font-weight: 500">DAY 47</span>
      <span style="font-size: 10px">WED 12 AUG 2026</span>
    </div>
  </div>
  <div aria-hidden="true" style="position: absolute; right: 0; top: 118px; width: 30px; height: 78px; box-sizing: border-box; border: 1px solid #D9DAD3; border-right: none; border-radius: 4px 0 0 4px; display: flex; align-items: center; justify-content: center">
    <span style="writing-mode: vertical-rl; font-size: 10px; font-weight: 600; letter-spacing: 0.14em; color: #B8430F">DAYS</span>
  </div>

  <div style="position: absolute; inset: 0; background: rgba(28,29,26,0.32)"></div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 520px; background: #F7F7F4; border-radius: 22px 22px 0 0; padding: 12px 20px 0; box-sizing: border-box">
    <div aria-hidden="true" style="width: 32px; height: 4px; border-radius: 2px; background: #C9CBC3; margin: 0 auto 18px"></div>
    <h2 style="margin: 0 0 8px; font-family: 'Newsreader', Georgia, serif; font-size: 26px; font-weight: 500">Days</h2>
    <sc-for list="{{days}}" as="d" hint-placeholder-count="5">
      <a href="#" style="display: block; padding: 12px 0; border-bottom: 1px solid #D9DAD3; text-decoration: none; color: #1C1D1A">
        <span style="display: flex; align-items: baseline; gap: 10px; font-family: 'Martian Mono', monospace">
          <span style="font-size: 13px; font-weight: 500">{{d.day}}</span>
          <span style="font-size: 10px; color: #5E615A">{{d.date}}</span>
          <span style="flex: 1"></span>
          <span style="font-family: 'Schibsted Grotesk', sans-serif; font-size: 10px; font-weight: 600; letter-spacing: 0.14em; color: #B8430F">{{d.tag}}</span>
        </span>
        <span style="display: block; margin-top: 4px; font-family: 'Newsreader', Georgia, serif; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: {{d.ink}}">{{d.line}}</span>
      </a>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      days: [
        { day: 'DAY 47', date: 'WED 12 AUG 2026', tag: 'TODAY', line: 'Nothing written yet', ink: '#5E615A' },
        { day: 'DAY 46', date: 'TUE 11 AUG 2026', tag: '', line: 'Over Muir Pass in hail, then the long drop into Evolution Basin.', ink: '#1C1D1A' },
        { day: 'DAY 45', date: 'MON 10 AUG 2026', tag: '', line: 'Evolution Creek ford, thigh deep and cold.', ink: '#1C1D1A' },
        { day: 'DAY 44', date: 'SUN 9 AUG 2026', tag: '', line: 'Zero in Muir Trail Ranch. Resupply bucket, hot spring.', ink: '#1C1D1A' },
        { day: 'DAY 43', date: 'SAT 8 AUG 2026', tag: '', line: 'Selden Pass by noon; Sallie Keyes Lakes for lunch.', ink: '#1C1D1A' }
      ]
    };
  }
}
</script>
</body>
</html>
